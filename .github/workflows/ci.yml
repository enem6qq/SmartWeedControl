name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Bei schnell aufeinanderfolgenden Pushes nur den neuesten Stand bauen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, Lint & APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy braucht ein Python 3.8 zum Paketieren der Python-Abhängigkeiten
      - name: Python 3.8 einrichten (für Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Chaquopy buildPython konfigurieren
        run: echo "chaquopy.buildPython=$(which python)" > local.properties

      # Golden-Image-Tests für die Bildanalyse (läuft ohne Android-Emulator).
      # WICHTIG: exakt die OpenCV-Version testen, die Chaquopy ins APK packt
      # (app/build.gradle pinnt opencv-python-headless==4.5.1.48) — sonst
      # validieren die Tests eine andere Bibliothek als die App ausliefert.
      - name: Python-Analyse-Tests (pytest)
        run: |
          pip install --quiet -r requirements-ci.txt
          PYTHONPATH=app/src/main/python pytest app/src/test/python/ -v

      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Java-Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      # Baut das komplette APK inkl. Chaquopy/OpenCV-Packaging — genau der
      # fehleranfälligste Schritt, der vorher nie in der CI lief.
      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: smartweedcontrol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Lint-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
