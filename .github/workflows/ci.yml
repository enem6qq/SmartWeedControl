name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimalrechte für das GITHUB_TOKEN: Der Workflow liest nur den Code und
# lädt Artefakte hoch — ohne diesen Block erbt er die (potenziell weiteren)
# Default-Rechte der Repo-Einstellungen.
permissions:
  contents: read

# Bei schnell aufeinanderfolgenden Pushes nur den neuesten Stand bauen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, Lint & APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      # Alle Actions auf Commit-SHAs gepinnt (Supply-Chain-Härtung): Ein
      # bewegliches Major-Tag wie @v4 könnte nachträglich auf kompromittierten
      # Code umgehängt werden. Der Kommentar nennt das gepinnte Tag.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy braucht ein Python 3.8 zum Paketieren der Python-Abhängigkeiten
      - name: Python 3.8 einrichten (für Chaquopy)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Chaquopy buildPython konfigurieren
        run: echo "chaquopy.buildPython=$(which python)" > local.properties

      # Golden-Image-Tests für die Bildanalyse (läuft ohne Android-Emulator).
      # WICHTIG: exakt die OpenCV-Version testen, die Chaquopy ins APK packt
      # (app/build.gradle pinnt opencv-python-headless==4.5.1.48) — sonst
      # validieren die Tests eine andere Bibliothek als die App ausliefert.
      - name: Python-Analyse-Tests (pytest)
        run: |
          pip install --quiet -r requirements-ci.txt
          PYTHONPATH=app/src/main/python pytest app/src/test/python/ -v

      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Java-Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon

      # Baut das komplette APK inkl. Chaquopy/OpenCV-Packaging — genau der
      # fehleranfälligste Schritt, der vorher nie in der CI lief.
      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartweedcontrol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Lint-Report hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
