plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.chaquo.python)
}

// Optionale, rechnerspezifische Einstellungen aus local.properties lesen
// (z. B. chaquopy.buildPython=C:/Pfad/zu/Python38/python.exe)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.example.smartweed'
    compileSdk 35

    defaultConfig {
        // Eindeutige App-ID (com.example.* würde Google Play ablehnen und ist
        // nach Veröffentlichung nicht mehr änderbar)
        applicationId "de.smartweedcontrol.app"
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName "1.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Chaquopy verlangt explizite ABIs.
        // x86_64 ist für den Android-Emulator nötig (macht das APK etwas größer —
        // für ein reines Geräte-Release kann es entfernt werden).
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        // >>> Chaquopy-Konfiguration
        python {
            // WICHTIG: Chaquopy-Repo bietet OpenCV-Wheels für cp38 ⇒ Python 3.8 verwenden
            version "3.8"

            // Build-Python ist rechnerspezifisch und kommt deshalb aus local.properties:
            //   chaquopy.buildPython=C:/Users/<name>/AppData/Local/Programs/Python/Python38/python.exe
            // Ohne Eintrag sucht Chaquopy selbst nach einer passenden Python-3.8-Installation.
            def configuredBuildPython = localProps.getProperty('chaquopy.buildPython')
            if (configuredBuildPython) {
                buildPython configuredBuildPython
            }

            pip {
                // OpenCV Headless – Version, die im Chaquopy-Repo für cp38 vorhanden ist

                install "opencv-python-headless==4.5.1.48"

                // NumPy exakt auf den CI-Stand pinnen (requirements-ci.txt):
                // Die pytest-Suite validiert genau diese Version — ohne Pin
                // wäre die Übereinstimmung zwischen APK und CI nur Zufall
                // (Chaquopy zöge die jeweils neueste cp38-numpy).
                install "numpy==1.19.5"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        // AGP 8 generiert BuildConfig nicht mehr automatisch; wird für die
        // Footer-Version (BuildConfig.VERSION_NAME) gebraucht
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // CameraX + Glide (Versionen zentral im Version-Catalog gradle/libs.versions.toml)
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.glide
    annotationProcessor libs.glide.compiler
}
