plugins {
    alias(libs.plugins.android.application)
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.smartweed'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.smartweed"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Chaquopy verlangt explizite ABIs
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
            // Für Emulator zusätzlich:
            // abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        // >>> Chaquopy-Konfiguration
        python {
            // WICHTIG: Chaquopy-Repo bietet OpenCV-Wheels für cp38 ⇒ Python 3.8 verwenden
            version "3.8"

            // Build-Python MUSS eine echte Python-3.8-Exe sein (kein einzelner String mit Argument).
            // Ersetze den Pfad unten durch den aus dem obigen cmd-Befehl.
            buildPython "C:/Users/acer/AppData/Local/Programs/Python/Python38/python.exe"
            // Alternativ (direkt zur 3.8-Exe, wenn du den Pfad kennst):
            // buildPython "C:/Users/PC/AppData/Local/Programs/Python/Python38/python.exe"

            pip {
                // OpenCV Headless – Version, die im Chaquopy-Repo für cp38 vorhanden ist

                install "opencv-python-headless==4.5.1.48"

                // NumPy NICHT pinnen: wird automatisch als passendes Wheel mit installiert
                // (Chaquopy-Repo liefert passende numpy-Wheels für cp38).
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // CameraX
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'


}
